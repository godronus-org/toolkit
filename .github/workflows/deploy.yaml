name: Deploy

# Reusable deploy for a single-app repo. The caller only declares triggers;
# this workflow decides the environment from the event (G1, G1b, T10):
#   push tag v*               → prod   (only if the tagged commit is on main)
#   push to main             → preprod (skipped for release-please merges)
#   workflow_dispatch on a branch → preprod (may skip tests — H4a)
#   workflow_dispatch on a v* tag → prod: deploy that version (rollback / roll
#                                   forward to any release, no time limit)
#
# Prod deploys the Release's .wasm, the copy of record (T35): the first run
# builds, tests and attaches <name>.wasm + <name>.wasm.sha256 (never replaced);
# every run downloads both, checks the SHA-256 and deploys those exact bytes.
# Re-running a tag's deploy therefore redeploys the same binary, no rebuild.
#
# Caller:
#   on:
#     push: { branches: [main], tags: ["v*"] }
#     workflow_dispatch: { inputs: { skip_tests: { type: boolean, default: false } } }
#   jobs:
#     deploy:
#       if: github.repository_owner == 'godronus-org'
#       uses: godronus-org/toolkit/.github/workflows/deploy.yaml@v1
#       with: { skip_tests: ${{ inputs.skip_tests || false }} }
#       secrets: inherit

on:
  workflow_call:
    inputs:
      skip_tests:
        description: Manual preprod runs only — deploy even if tests are missing or failing (H4a).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Separate job so a skip never starts the deploy job: GitHub evaluates a skipped
  # step's env/with expressions, and fromJSON('') fails on an unresolved config.
  target:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - name: Choose environment
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MESSAGE: ${{ github.event.head_commit.message }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          case "$EVENT:$REF" in
            push:refs/tags/v*|workflow_dispatch:refs/tags/v*) env=prod ;;
            push:refs/heads/main)
              case "$MESSAGE" in
                "chore(main): release"*|"chore: release"*) env=skip ;;  # G1b
                *) env=preprod ;;
              esac ;;
            workflow_dispatch:*)     env=preprod ;;
            *) echo "::error::No deploy target for $EVENT on $REF"; exit 1 ;;
          esac
          if [ "$SKIP_TESTS" = true ] && { [ "$EVENT" != workflow_dispatch ] || [ "$env" = prod ]; }; then
            echo "::error::skip_tests is only allowed on manual preprod runs (H4a)"; exit 1
          fi
          echo "Target: $env"
          echo "environment=$env" >> "$GITHUB_OUTPUT"

  deploy:
    needs: target
    if: needs.target.outputs.environment != 'skip'
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ needs.target.outputs.environment }}
    steps:
      # Fail closed: an empty or unknown target must never resolve or deploy.
      - name: Check environment
        run: |
          case "$ENVIRONMENT" in
            preprod|prod) echo "Deploying to $ENVIRONMENT" ;;
            *) echo "::error::Invalid deploy environment '$ENVIRONMENT'"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse tags not on main (T10)
        if: env.ENVIRONMENT == 'prod'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main — prod deploys only from main"; exit 1; }

      - name: Resolve fastedge.jsonc
        id: cfg
        uses: godronus-org/toolkit/actions/resolve-config@v1
        with:
          environment: ${{ env.ENVIRONMENT }}

      - name: Supported config
        env:
          CONFIG: ${{ steps.cfg.outputs.json }}
        run: |
          case "$(jq -r .kind <<<"$CONFIG")" in
            library)  echo "::error::A library has nothing to deploy"; exit 1 ;;
            monorepo) echo "::error::Monorepo deploys are not implemented yet (T21)"; exit 1 ;;
          esac
          if [ "$(jq '.app.secrets // {} | length' <<<"$CONFIG")" != 0 ]; then
            echo "::error::App secrets are not implemented yet (SCHEMA S-6)"; exit 1
          fi

      # Prod deploys the Release's .wasm — the copy of record (T35). It is built,
      # tested and attached once; a re-run fetches and verifies it instead.
      - name: Org App token
        id: app
        if: env.ENVIRONMENT == 'prod'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_BOT_APP_ID }}
          private-key: ${{ secrets.ORG_BOT_APP_PRIVATE_KEY }}

      - name: Release asset
        id: asset
        if: env.ENVIRONMENT == 'prod'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          names=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          wasm=$(grep '\.wasm$' <<<"$names" || true)
          case "$(grep -c . <<<"$wasm")" in
            0) echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No .wasm on $GITHUB_REF_NAME yet — building it" ;;
            1) grep -qx "$wasm.sha256" <<<"$names" || { echo "::error::$wasm has no $wasm.sha256 on the release"; exit 1; }
               echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release already has $wasm — deploying it, no rebuild" ;;
            *) echo "::error::$GITHUB_REF_NAME has more than one .wasm asset"; exit 1 ;;
          esac

      - name: Enable pnpm
        if: steps.cfg.outputs.language != 'rust' && steps.asset.outputs.exists != 'true'
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Build
        if: steps.asset.outputs.exists != 'true'
        env:
          COMMAND: ${{ fromJSON(steps.cfg.outputs.build).command }}
        run: eval "$COMMAND"

      # After the build: fastedge-test suites run the built .wasm.
      - name: Test
        if: '!inputs.skip_tests && steps.asset.outputs.exists != ''true'''
        uses: godronus-org/toolkit/actions/run-tests@v1
        with:
          tests: ${{ steps.cfg.outputs.tests }}
          strict: ${{ env.ENVIRONMENT == 'prod' }}

      - name: Locate wasm
        id: built
        if: steps.asset.outputs.exists != 'true'
        env:
          OUTPUT: ${{ fromJSON(steps.cfg.outputs.build).output }}
        run: |
          if [ -d "$OUTPUT" ]; then
            files=("$OUTPUT"/*.wasm)
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
              echo "::error::Expected exactly one .wasm in $OUTPUT (S-3) — set build.output"; exit 1
            fi
            OUTPUT="${files[0]}"
          fi
          [ -f "$OUTPUT" ] || { echo "::error::Build output $OUTPUT not found"; exit 1; }
          echo "Built $OUTPUT"
          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Attach wasm + SHA-256 to the release
        if: env.ENVIRONMENT == 'prod' && steps.asset.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BUILT: ${{ steps.built.outputs.path }}
        run: |
          name=$(basename "$BUILT")
          dir="$RUNNER_TEMP/upload" && mkdir -p "$dir" && cp "$BUILT" "$dir/$name"
          (cd "$dir" && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")
          # No --clobber: an asset of record is never replaced.
          gh release upload "$GITHUB_REF_NAME" "$dir/$name" "$dir/$name.sha256" --repo "$GITHUB_REPOSITORY"

      - name: Fetch and verify the release asset
        id: verified
        if: env.ENVIRONMENT == 'prod'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          dir="$RUNNER_TEMP/release" && mkdir -p "$dir" && cd "$dir"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.wasm' --pattern '*.wasm.sha256'
          sha256sum -c ./*.sha256
          echo "path=$dir/$(ls ./*.wasm | xargs basename)" >> "$GITHUB_OUTPUT"

      - name: Wasm to deploy
        id: wasm
        env:
          VERIFIED: ${{ steps.verified.outputs.path }}
          BUILT: ${{ steps.built.outputs.path }}
        run: |
          path=${VERIFIED:-$BUILT}
          [ -f "$path" ] || { echo "::error::nothing to deploy"; exit 1; }
          echo "Deploying $path ($(sha256sum "$path" | cut -d' ' -f1))"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Read instructions
        id: instructions
        if: steps.cfg.outputs.kind == 'template'
        env:
          # Step env is evaluated before `if`, so never fromJSON() an output that
          # may be empty (the template block is empty on app deploys).
          CONFIG: ${{ steps.cfg.outputs.json }}
        run: |
          FILE=$(jq -r .template.instructions <<<"$CONFIG")
          {
            echo 'markdown<<__INSTRUCTIONS__'
            if [ -f "$FILE" ]; then cat "$FILE"; else echo "::warning::$FILE not found" >&2; fi
            echo '__INSTRUCTIONS__'
          } >> "$GITHUB_OUTPUT"

      # One environment's credentials only (same rule as the old gcore-auth action).
      - name: Deploy template
        if: steps.cfg.outputs.kind == 'template'
        uses: gcore-github-actions/fastedge/deploy-template@v1
        with:
          api_key: ${{ env.ENVIRONMENT == 'prod' && secrets.GCORE_PROD_API_KEY || secrets.GCORE_PREPROD_API_KEY }}
          api_url: ${{ env.ENVIRONMENT == 'prod' && vars.GCORE_PROD_API_URL || vars.GCORE_PREPROD_API_URL }}
          wasm_file: ${{ steps.wasm.outputs.path }}
          template_name: ${{ fromJSON(steps.cfg.outputs.template).name }}
          template_id: ${{ fromJSON(steps.cfg.outputs.template).id || 0 }}
          short_descr: ${{ fromJSON(steps.cfg.outputs.template).description }}
          long_descr: ${{ steps.instructions.outputs.markdown }}
          params: ${{ toJSON(fromJSON(steps.cfg.outputs.template).params) }}

      # IaC marker (E14, frontend GH-18): the portal's Deployments tab shows a
      # marked app read-only, with the live version and where to deploy/roll back.
      - name: IaC marker
        id: marker
        if: steps.cfg.outputs.kind == 'app'
        env:
          APP: ${{ steps.cfg.outputs.app }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          if [ "$ENVIRONMENT" = prod ]; then version=$GITHUB_REF_NAME; else version="$GITHUB_REF_NAME@${GITHUB_SHA::7}"; fi
          file=${WORKFLOW_REF%@*}; file=${file##*/}
          comment="Managed by IaC (fastedge.jsonc) $version: https://github.com/$GITHUB_REPOSITORY/actions/workflows/$file"
          extra=$(jq -r '.comment // empty' <<<"$APP")
          [ -n "$extra" ] && comment="$comment — $extra"
          echo "$comment"
          echo "comment=$comment" >> "$GITHUB_OUTPUT"

      - name: Deploy app
        id: deployapp
        if: steps.cfg.outputs.kind == 'app'
        uses: gcore-github-actions/fastedge/deploy-app@v1
        with:
          api_key: ${{ env.ENVIRONMENT == 'prod' && secrets.GCORE_PROD_API_KEY || secrets.GCORE_PREPROD_API_KEY }}
          api_url: ${{ env.ENVIRONMENT == 'prod' && vars.GCORE_PROD_API_URL || vars.GCORE_PREPROD_API_URL }}
          wasm_file: ${{ steps.wasm.outputs.path }}
          app_name: ${{ fromJSON(steps.cfg.outputs.app).name }}
          app_id: ${{ fromJSON(steps.cfg.outputs.app).id || 0 }}
          comment: ${{ steps.marker.outputs.comment }}
          env: ${{ toJSON(fromJSON(steps.cfg.outputs.app).env || fromJSON('{}')) }}
          rsp_headers: ${{ toJSON(fromJSON(steps.cfg.outputs.app).rsp_headers || fromJSON('{}')) }}

      - name: Summary
        if: steps.cfg.outputs.kind == 'app'
        env:
          APP_ID: ${{ steps.deployapp.outputs.app_id }}
          APP_URL: ${{ steps.deployapp.outputs.app_url }}
          WASM: ${{ steps.wasm.outputs.path }}
        run: |
          {
            echo "### Deployed to $ENVIRONMENT"
            echo "- app id: \`$APP_ID\`"
            echo "- url: $APP_URL"
            echo "- wasm sha256: \`$(sha256sum "$WASM" | cut -d' ' -f1)\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
